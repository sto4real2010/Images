<!--This is a profile image is meaningful attribute-->
<img src="sam2.jpg" alt="Prof. Samuel Oloruntobi, Head Of Department (Mathematics) AAUA." width="100" height="150" />

<!--This is figure image-->
<figure><img src="sam4.jpg" alt="Samuel Oloruntobi, Full stack mentee" width="150" height="300" /> 
    <figcaption>This is brown shoes of Samuel Oloruntobi</figcaption>
</figure>

<!--This is decorative image-->
<p><img src="sam3.jpg" alt=" " width="100px" height="150px" /></p>

<!--This is Video with source-->
<p><video controls 
width="200" height="400"
autoplay loop muted preload="auto" poster="sam1.jpg">

    <a href="sam1.mp4"> link to the video</a> instead.</p>
</video></p>

</audio></p>
